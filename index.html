<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مشغل الفيديوهات المباشر</title>
    <style>
        body {
            font-family: Tahoma, sans-serif;
            background-color: #121212;
            color: #fff;
            text-align: center;
            padding: 20px;
            margin: 0;
        }
        .input-container {
            margin: 20px auto;
            max-width: 650px;
        }
        input[type="text"] {
            width: 100%;
            padding: 12px;
            font-size: 15px;
            border: 1px solid #444;
            border-radius: 6px;
            outline: none;
            background: #222;
            color: #fff;
            box-sizing: border-box;
            margin-bottom: 10px;
            direction: ltr;
            text-align: left;
        }
        .btn-group {
            display: flex;
            gap: 10px;
            justify-content: center;
        }
        button, .btn-download {
            padding: 10px 20px;
            font-size: 16px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            color: white;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        .btn-play { background-color: #cc0000; }
        .btn-download { background-color: #28a745; }

        .video-container {
            position: relative;
            width: 100%;
            max-width: 800px;
            aspect-ratio: 16 / 9;
            background: #000;
            margin: 20px auto;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            transition: aspect-ratio 0.3s ease;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
    </style>
</head>
<body>

    <h1>مشغل الفيديوهات المباشر</h1>
    
    <div class="input-container">
        <input type="text" id="videoUrl" placeholder="الصق رابط الفيديو المباشر (.mp4) هنا..." value="https://www.w3schools.com/html/mov_bbb.mp4">
        
        <div class="btn-group">
            <button class="btn-play" onclick="loadVideo()">تشغيل الفيديو</button>
            <a id="downloadBtn" class="btn-download" href="https://www.w3schools.com/html/mov_bbb.mov" download target="_blank">تحميل الفيديو</a>
        </div>
    </div>

    <div class="video-container" id="videoContainer">
        <video id="myVideo" controls>
            <source id="videoSource" src="https://www.w3schools.com/html/mov_bbb.mp4" type="video/mp4">
            متصفحك لا يدعم تشغيل الفيديو.
        </video>
    </div>

    <script>
        const videoElement = document.getElementById("myVideo");
        const videoContainer = document.getElementById("videoContainer");
        const downloadBtn = document.getElementById("downloadBtn");

        // ضبط الأبعاد تلقائياً حسب الفيديو (طولي أم عرضي)
        videoElement.addEventListener('loadedmetadata', function() {
            const width = videoElement.videoWidth;
            const height = videoElement.videoHeight;
            if (width && height) {
                videoContainer.style.aspectRatio = `${width} / ${height}`;
            }
        });

        function loadVideo() {
            var urlInput = document.getElementById("videoUrl").value.trim();
            var sourceElement = document.getElementById("videoSource");

            if (urlInput !== "") {
                sourceElement.src = urlInput;
                videoElement.load();
                downloadBtn.href = urlInput;

                videoElement.play().catch(error => {
                    console.log("التشغيل التلقائي محظور، يرجى الضغط يدويًا.");
                });
            } else {
                alert("الرجاء إدخال رابط صحيح أولاً!");
            }
        }
    </script>

</body>
</html>
